            // Clipboard fallback for Firefox and restrictive environments.
            // Uses temporary textarea + execCommand('copy') when Clipboard API fails.
            window.cyborgaiCopyText = function(text) {
                // Try modern Clipboard API first
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(function() {
                        // Fallback: textarea + execCommand
                        _cyborgaiFallbackCopy(text);
                    });
                } else {
                    _cyborgaiFallbackCopy(text);
                }
            };
            function _cyborgaiFallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try { document.execCommand('copy'); } catch(e) {}
                document.body.removeChild(ta);
            }
        </script>
